# Fork-only Windows retry; macOS passed in run 41204788953 and is not repeated.
name: Fork Desktop Package Validation
on:
  push:
    branches:
      - codex/fork-desktop-package-validation
permissions:
  contents: read
concurrency:
  group: fork-desktop-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: package:windows
            asset: win-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate candidate shell versions
        id: version
        shell: bash
        run: >-
          version=$(node -p
          'JSON.parse(require("fs").readFileSync("apps/desktop/package.json",
          "utf8")).version')

          node scripts/release-notes.mjs check --tag="app-v$version"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build native desktop package
        run: npm run ${{ matrix.script }} -w apps/desktop
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: hdiutil verify "apps/desktop/release/Spex-$VERSION-mac-arm64.dmg"
      - name: Verify unsigned CRT rejection
        run: node --input-type=module -e
          "import{mkdtempSync,writeFileSync,rmSync}from'node:fs';import{tmpdir}from'node:os';import{join}from'node:path';import{spawnSync}from'node:child_process';const
          d=mkdtempSync(join(tmpdir(),'spex-unsigned-crt-'));try{for(const n
          of['vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll'])writeFileSync(join(d,n),'unsigned
          fixture');const
          r=spawnSync(process.execPath,['apps/desktop/scripts/stage-windows-runtime.mjs'],{encoding:'utf8',env:{...process.env,SPEX_WINDOWS_CRT_DIR:d}});if(r.status===0||!r.stderr.includes('Microsoft
          signature verification failed'))throw Error(r.stderr||'Unsigned CRT
          accepted');console.log('Unsigned CRT rejected by Microsoft signature
          gate')}finally{rmSync(d,{recursive:true,force:true})}"
      - name: Record installer identity
        env:
          INSTALLER: apps/desktop/release/Spex-${{ steps.version.outputs.version }}-${{
            matrix.asset }}
        run: node --input-type=module -e
          "import{readFileSync,writeFileSync}from'node:fs';import{createHash}from'node:crypto';const
          p=process.env.INSTALLER,b=readFileSync(p);if(b.length<1000000)throw
          Error('Installer unexpectedly
          small');if(process.platform==='win32'&&b.subarray(0,2).toString()!=='MZ')throw
          Error('Invalid Windows
          executable');writeFileSync('installer-proof.json',JSON.stringify({commit:process.env.GITHUB_SHA,platform:process.platform,arch:process.arch,file:p,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')},null,2));console.log(readFileSync('installer-proof.json','utf8'))"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: >-
            apps/desktop/release/Spex-${{ steps.version.outputs.version }}-${{
            matrix.asset }}

            installer-proof.json
          if-no-files-found: error
    timeout-minutes: 45
